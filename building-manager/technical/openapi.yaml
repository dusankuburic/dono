# ============================================================================
# COMPONENTS
# ============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    buildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    unitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    residentId:
      name: residentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    workOrderId:
      name: workOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    announcementId:
      name: announcementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    assemblyId:
      name: assemblyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # -------------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------------
    
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid input data
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
              description: Seconds until token expires
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            expiresIn:
              type: integer
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time

    UserWithProfile:
      type: object
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            profile:
              $ref: '#/components/schemas/Person'

    UserRole:
      type: string
      enum: [ADMIN, COMPANY_ADMIN, MANAGER, SUBSTITUTE, OWNER, TENANT]

    UserStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, DELETED]

    # -------------------------------------------------------------------------
    # Building
    # -------------------------------------------------------------------------

    Building:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        streetAddress:
          type: string
        streetNumber:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        yearBuilt:
          type: integer
        totalFloors:
          type: integer
        hasElevator:
          type: boolean
        hasParking:
          type: boolean
        totalAreaM2:
          type: number
        isLegalEntity:
          type: boolean
        legalEntityName:
          type: string
        mbNumber:
          type: string
        pib:
          type: string
        unitCount:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    BuildingListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Building'
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMeta'
            - $ref: '#/components/schemas/PaginationMeta'

    CreateBuildingRequest:
      type: object
      required: [streetAddress, streetNumber]
      properties:
        name:
          type: string
        streetAddress:
          type: string
        streetNumber:
          type: string
        city:
          type: string
        postalCode:
          type: string
        yearBuilt:
          type: integer
        totalFloors:
          type: integer
        hasElevator:
          type: boolean
        hasParking:
          type: boolean
        totalAreaM2:
          type: number

    UpdateBuildingRequest:
      type: object
      properties:
        name:
          type: string
        isLegalEntity:
          type: boolean
        legalEntityName:
          type: string
        mbNumber:
          type: string
        pib:
          type: string
        bankAccount:
          type: string
        registrationDate:
          type: string
          format: date

    # -------------------------------------------------------------------------
    # Unit
    # -------------------------------------------------------------------------

    Unit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        number:
          type: string
        floor:
          type: integer
        entrance:
          type: string
        areaM2:
          type: number
        ownershipShare:
          type: number
        votingShare:
          type: number
        type:
          $ref: '#/components/schemas/UnitType'
        status:
          $ref: '#/components/schemas/UnitStatus'
        ownerCount:
          type: integer
        residentCount:
          type: integer

    UnitDetail:
      allOf:
        - $ref: '#/components/schemas/Unit'
        - type: object
          properties:
            owners:
              type: array
              items:
                $ref: '#/components/schemas/Ownership'
            residents:
              type: array
              items:
                $ref: '#/components/schemas/Person'

    UnitListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMeta'
            - $ref: '#/components/schemas/PaginationMeta'

    UnitType:
      type: string
      enum: [APARTMENT, STUDIO, LOFT, COMMERCIAL, OFFICE, GARAGE, STORAGE, MIXED_USE]

    UnitStatus:
      type: string
      enum: [OCCUPIED_OWNER, OCCUPIED_FAMILY, OCCUPIED_TENANT, VACANT, UNDER_RENOVATION]

    CreateUnitRequest:
      type: object
      required: [number, floor, areaM2, ownershipShare]
      properties:
        number:
          type: string
        floor:
          type: integer
        entrance:
          type: string
        position:
          type: string
        areaM2:
          type: number
        roomCount:
          type: integer
        bedroomCount:
          type: integer
        bathroomCount:
          type: integer
        ownershipShare:
          type: number
        type:
          $ref: '#/components/schemas/UnitType'

    UpdateUnitRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/UnitStatus'
        roomCount:
          type: integer
        bedroomCount:
          type: integer
        bathroomCount:
          type: integer

    # -------------------------------------------------------------------------
    # Person / Resident
    # -------------------------------------------------------------------------

    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        preferredName:
          type: string
        phones:
          type: array
          items:
            $ref: '#/components/schemas/Phone'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/Email'
        emergencyName:
          type: string
        emergencyPhone:
          type: string
        avatarUrl:
          type: string
        isActive:
          type: boolean

    PersonDetail:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          properties:
            units:
              type: array
              items:
                type: object
                properties:
                  unit:
                    $ref: '#/components/schemas/Unit'
                  role:
                    type: string
                    enum: [owner, tenant, family]
                  ownershipShare:
                    type: number

    Phone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        type:
          $ref: '#/components/schemas/PhoneType'
        isPrimary:
          type: boolean
        isVerified:
          type: boolean

    PhoneType:
      type: string
      enum: [MOBILE, HOME, WORK, OTHER]

    Email:
      type: object
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
          format: email
        type:
          type: string
        isPrimary:
          type: boolean
        isVerified:
          type: boolean

    Ownership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/Person'
        unitId:
          type: string
          format: uuid
        share:
          type: number
        canVote:
          type: boolean
        unavailableStatus:
          $ref: '#/components/schemas/UnavailableStatus'

    UnavailableStatus:
      type: string
      enum: [ACTIVE, WARNING, POTENTIALLY_UNAVAILABLE, CONFIRMED_UNAVAILABLE]

    ResidentListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMeta'
            - $ref: '#/components/schemas/PaginationMeta'

    CreateResidentRequest:
      type: object
      required: [firstName, lastName, unitId, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        unitId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, tenant, family]
        phone:
          type: string
        email:
          type: string
          format: email
        emergencyName:
          type: string
        emergencyPhone:
          type: string
        ownershipShare:
          type: number
          description: Required if role is owner
        moveInDate:
          type: string
          format: date
        leaseStart:
          type: string
          format: date
          description: Required if role is tenant
        leaseEnd:
          type: string
          format: date

    UpdateResidentRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        preferredName:
          type: string
        emergencyName:
          type: string
        emergencyPhone:
          type: string
        isActive:
          type: boolean

    OccupancyRecord:
      type: object
      properties:
        unitId:
          type: string
          format: uuid
        unitNumber:
          type: string
        role:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string

    # -------------------------------------------------------------------------
    # Keys
    # -------------------------------------------------------------------------

    Key:
      type: object
      properties:
        id:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        identifier:
          type: string
        type:
          $ref: '#/components/schemas/KeyType'
        description:
          type: string
        status:
          $ref: '#/components/schemas/KeyStatus'
        currentTransaction:
          $ref: '#/components/schemas/KeyTransaction'

    KeyDetail:
      allOf:
        - $ref: '#/components/schemas/Key'
        - type: object
          properties:
            unit:
              $ref: '#/components/schemas/Unit'
            transactionHistory:
              type: array
              items:
                $ref: '#/components/schemas/KeyTransaction'

