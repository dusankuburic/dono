openapi: 3.0.3
info:
  title: Building Manager API
  description: API for the Building Manager (Upravnik Zgrade) application
  version: 1.0.0
  contact:
    name: Building Manager Team
    email: support@upravnik.app

servers:
  - url: https://api.upravnik.app/api/v1
    description: Production
  - url: https://staging-api.upravnik.app/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Development

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Buildings
    description: Building management
  - name: Units
    description: Unit management
  - name: Residents
    description: Resident management
  - name: Keys
    description: Key management
  - name: Work Orders
    description: Maintenance work orders
  - name: Announcements
    description: Announcements and notifications
  - name: Assemblies
    description: Assembly meetings and voting
  - name: Finance
    description: Financial management
  - name: Documents
    description: Document management
  - name: Service Providers
    description: Contractor management
  - name: Deadlines
    description: Deadline tracking
  - name: Sync
    description: Offline sync

paths:
  # ============================================================================
  # AUTH
  # ============================================================================
  
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email or phone already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (if email exists)

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithProfile'

  # ============================================================================
  # BUILDINGS
  # ============================================================================

  /buildings:
    get:
      tags: [Buildings]
      summary: List user's buildings
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: List of buildings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingListResponse'
    post:
      tags: [Buildings]
      summary: Create building
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildingRequest'
      responses:
        '201':
          description: Building created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/ValidationError'

  /buildings/{buildingId}:
    get:
      tags: [Buildings]
      summary: Get building details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      responses:
        '200':
          description: Building details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Buildings]
      summary: Update building
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuildingRequest'
      responses:
        '200':
          description: Building updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Buildings]
      summary: Archive building
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      responses:
        '200':
          description: Building archived
        '404':
          $ref: '#/components/responses/NotFound'

  /buildings/{buildingId}/units:
    get:
      tags: [Units]
      summary: List building units
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: floor
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UnitStatus'
      responses:
        '200':
          description: List of units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitListResponse'
    post:
      tags: [Units]
      summary: Create unit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnitRequest'
      responses:
        '201':
          description: Unit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/ValidationError'

  /buildings/{buildingId}/units/{unitId}:
    get:
      tags: [Units]
      summary: Get unit details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
      responses:
        '200':
          description: Unit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Units]
      summary: Update unit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
        - $ref: '#/components/parameters/unitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUnitRequest'
      responses:
        '200':
          description: Unit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # RESIDENTS
  # ============================================================================

  /buildings/{buildingId}/residents:
    get:
      tags: [Residents]
      summary: List residents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          description: Search by name, unit number, or phone
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, tenant, family]
        - name: unitId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of residents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentListResponse'
    post:
      tags: [Residents]
      summary: Create resident
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResidentRequest'
      responses:
        '201':
          description: Resident created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/ValidationError'

  /residents/{residentId}:
    get:
      tags: [Residents]
      summary: Get resident details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/residentId'
      responses:
        '200':
          description: Resident details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Residents]
      summary: Update resident
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/residentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResidentRequest'
      responses:
        '200':
          description: Resident updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Residents]
      summary: Archive resident
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/residentId'
      responses:
        '200':
          description: Resident archived
        '404':
          $ref: '#/components/responses/NotFound'

  /residents/{residentId}/history:
    get:
      tags: [Residents]
      summary: Get occupancy history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/residentId'
      responses:
        '200':
          description: Occupancy history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccupancyRecord'

  # ============================================================================
  # KEYS
  # ============================================================================

  /buildings/{buildingId}/keys:
    get:
      tags: [Keys]
      summary: List keys
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/KeyType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/KeyStatus'
        - name: unitId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyListResponse'
    post:
      tags: [Keys]
      summary: Create key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: Key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '400':
          $ref: '#/components/responses/ValidationError'

  /buildings/{buildingId}/keys/overdue:
    get:
      tags: [Keys]
      summary: List overdue keys
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      responses:
        '200':
          description: List of overdue keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyWithTransaction'

  /keys/{keyId}:
    get:
      tags: [Keys]
      summary: Get key details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/keyId'
      responses:
        '200':
          description: Key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Keys]
      summary: Update key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/keyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRequest'
      responses:
        '200':
          description: Key updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Keys]
      summary: Delete key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/keyId'
      responses:
        '200':
          description: Key deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /keys/{keyId}/checkout:
    post:
      tags: [Keys]
      summary: Checkout key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/keyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCheckoutRequest'
      responses:
        '200':
          description: Key checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyTransaction'
        '400':
          description: Key already checked out
        '404':
          $ref: '#/components/responses/NotFound'

  /keys/{keyId}/checkin:
    post:
      tags: [Keys]
      summary: Checkin key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/keyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCheckinRequest'
      responses:
        '200':
          description: Key checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyTransaction'
        '400':
          description: Key not checked out
        '404':
          $ref: '#/components/responses/NotFound'

  /keys/{keyId}/history:
    get:
      tags: [Keys]
      summary: Get key transaction history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/keyId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyTransactionListResponse'

  # ============================================================================
  # WORK ORDERS
  # ============================================================================

  /buildings/{buildingId}/work-orders:
    get:
      tags: [Work Orders]
      summary: List work orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WorkOrderStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/WorkOrderCategory'
        - name: unitId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderListResponse'
    post:
      tags: [Work Orders]
      summary: Create work order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderRequest'
      responses:
        '201':
          description: Work order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/ValidationError'

  /work-orders/{workOrderId}:
    get:
      tags: [Work Orders]
      summary: Get work order details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      responses:
        '200':
          description: Work order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Work Orders]
      summary: Update work order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkOrderRequest'
      responses:
        '200':
          description: Work order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /work-orders/{workOrderId}/status:
    post:
      tags: [Work Orders]
      summary: Update work order status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/WorkOrderStatus'
                notes:
                  type: string
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  /work-orders/{workOrderId}/notes:
    post:
      tags: [Work Orders]
      summary: Add note to work order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                isVisible:
                  type: boolean
                  default: true
                  description: Visible to resident
      responses:
        '201':
          description: Note added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderNote'
        '404':
          $ref: '#/components/responses/NotFound'

  /work-orders/{workOrderId}/photos:
    post:
      tags: [Work Orders]
      summary: Upload photo to work order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
      responses:
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderPhoto'
        '404':
          $ref: '#/components/responses/NotFound'

  /work-orders/{workOrderId}/assign:
    put:
      tags: [Work Orders]
      summary: Assign work order to service provider
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceProviderId]
              properties:
                serviceProviderId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Work order assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # ANNOUNCEMENTS
  # ============================================================================

  /buildings/{buildingId}/announcements:
    get:
      tags: [Announcements]
      summary: List announcements
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AnnouncementType'
      responses:
        '200':
          description: List of announcements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementListResponse'
    post:
      tags: [Announcements]
      summary: Create announcement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/buildingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequest'
      responses:
        '201':
          description: Announcement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '400':
          $ref: '#/components/responses/ValidationError'

  /announcements/{announcementId}:
    get:
      tags: [Announcements]
      summary: Get announcement details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '200':
          description: Announcement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Announcements]
      summary: Update announcement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/announcementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnnouncementRequest'
      responses:
        '200':
          description: Announcement updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Announcements]
      summary: Delete announcement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '200':
          description: Announcement deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /announcements/{announcementId}/stats:
    get:
      tags: [Announcements]
      summary: Get delivery statistics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '200':
          description: Delivery statistics
          content:
            application/json:
              schema:
