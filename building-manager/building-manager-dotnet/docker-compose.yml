services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/orleans-sql:/orleans-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U postgres -d building_manager_orleans -tAc 'SELECT 1 FROM orleansquery LIMIT 1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite_data:/data

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/BuildingManager.Api/Dockerfile
    restart: on-failure
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrleansStorage: "Host=postgres;Port=5432;Database=building_manager_orleans;Username=postgres;Password=postgres"
      Orleans__AdvertisedIPAddress: ""
      Orleans__ClusterId: building-manager-compose
      Storage__BlobConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Cors__AllowedOrigins__0: "http://localhost:${CLIENT_PORT:-5002}"
      Jwt__Secret: "${JWT_SECRET:-}"
      Auth__AdminEmail: "${ADMIN_EMAIL:-}"
      Auth__AdminPassword: "${ADMIN_PASSWORD:-}"
    ports:
      - "${API_PORT:-5000}:8080"

  client:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/BuildingManager.Blazor/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: "http://localhost:${API_PORT:-5000}"
    ports:
      - "${CLIENT_PORT:-5002}:80"

volumes:
  postgres_data:
  azurite_data:
