name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build building-manager-dotnet -c Release

      - name: Test
        run: dotnet test building-manager-dotnet/tests/BuildingManager.Tests -c Release --no-build

  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.AZURE_CREDENTIALS != ''
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT }}
      SILO_APP: building-manager-silo
      API_APP: building-manager-api
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and push images
        working-directory: building-manager-dotnet
        run: |
          TAG=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          az acr login --name "$ACR_NAME"
          docker build -f src/BuildingManager.Orleans.Silo/Dockerfile -t "$ACR_NAME.azurecr.io/silo:$TAG" -t "$ACR_NAME.azurecr.io/silo:latest" .
          docker build -f src/BuildingManager.Api/Dockerfile -t "$ACR_NAME.azurecr.io/api:$TAG" -t "$ACR_NAME.azurecr.io/api:latest" .
          docker push "$ACR_NAME.azurecr.io/silo:$TAG"
          docker push "$ACR_NAME.azurecr.io/silo:latest"
          docker push "$ACR_NAME.azurecr.io/api:$TAG"
          docker push "$ACR_NAME.azurecr.io/api:latest"

      - name: Deploy silo and API
        run: |
          az containerapp update -n "$SILO_APP" -g "$RESOURCE_GROUP" --image "$ACR_NAME.azurecr.io/silo:$TAG"
          az containerapp update -n "$API_APP" -g "$RESOURCE_GROUP" --image "$ACR_NAME.azurecr.io/api:$TAG"

      - name: Publish Blazor client to the static website
        run: |
          API_URL="https://$(az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          dotnet publish building-manager-dotnet/src/BuildingManager.Blazor -c Release -o ./blazor-publish
          jq --arg api "$API_URL" '.ApiBaseUrl = $api' ./blazor-publish/wwwroot/appsettings.json > ./blazor-publish/wwwroot/appsettings.tmp.json
          mv ./blazor-publish/wwwroot/appsettings.tmp.json ./blazor-publish/wwwroot/appsettings.json
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login \
            -s ./blazor-publish/wwwroot \
            -d '$web' \
            --overwrite true
